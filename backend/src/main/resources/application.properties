spring.application.name=PassHalo


# PostgreSQL Database Configuration
spring.datasource.url =jdbc:postgresql://localhost:5432/passhalo
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name= org.postgresql.Driver


# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security / JWT Configuration
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration-time=${JWT_EXPIRATION_TIME}


# Logging Configuration
spring.output.ansi.enabled=ALWAYS
logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss.SSS

# Log Levels
logging.level.root=INFO
logging.level.org.spring.passhalo=DEBUG

# File Logging & Rolling Policy
logging.file.name=logs/passhalo.log
logging.logback.rollingpolicy.file-name-pattern=logs/passhalo-%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB


#Mail Configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# Swagger Configuration
springdoc.swagger-ui.persist-authorization=true

app.time-zone=Europe/Rome
server.forward-headers-strategy=framework
