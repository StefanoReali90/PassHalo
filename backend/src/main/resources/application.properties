spring.application.name=PassHalo
# Optional local secrets prepared by prepare-local-config.ps1 (ignored by Git).
# IntelliJ may launch from the repository root or from backend.
spring.config.import=optional:file:./backend/.local.env[.properties],optional:file:./.local.env[.properties]


# PostgreSQL Database Configuration
spring.datasource.url =jdbc:postgresql://localhost:5432/passhalo
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name= org.postgresql.Driver


# Hibernate Configuration
# Existing databases require a controlled migration; opt in to schema updates explicitly.
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
# Do not write SQL statements (which may contain personal data) to application logs.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF

# Security / JWT Configuration
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration-time=${JWT_EXPIRATION_TIME}
app.security.pii.encryption-key=${PII_ENCRYPTION_KEY}
app.security.pii.lookup-key=${PII_LOOKUP_KEY}
# Enable only during a controlled migration run with application traffic disabled.
app.pii.migration.enabled=${PII_MIGRATION_ENABLED:false}
app.frontend.base-url=${FRONTEND_BASE_URL}
app.marketing.retention-months=${MARKETING_RETENTION_MONTHS:24}


# Logging Configuration
spring.output.ansi.enabled=ALWAYS
logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss.SSS

# Log Levels
logging.level.root=INFO
logging.level.org.spring.passhalo=INFO

# File Logging & Rolling Policy
logging.file.name=logs/passhalo.log
logging.logback.rollingpolicy.file-name-pattern=logs/passhalo-%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB


#Mail Configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# Swagger Configuration
springdoc.swagger-ui.persist-authorization=true

app.time-zone=Europe/Rome
server.forward-headers-strategy=framework
